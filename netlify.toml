# Netlify deployment: the frontend is served from the CDN and every /api/*
# request runs the Express app inside one serverless function. See HOSTING.md.
#
# Set ADMIN_PASSWORD, SESSION_SECRET and GOOGLE_SHEETS_URL (the Apps Script
# /exec address) in Netlify's environment variables, never in this file — a
# serverless function has no writable disk, so the local JSON fallback would
# lose every booking between invocations.

[build]
  command = "npm --prefix backend ci --omit=dev && node scripts/build-static.js"
  publish = "dist"
  functions = "backend/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Alternative setup: keep the frontend here and run backend/ on a Node host
# (Render, Railway, a VPS...). Delete the redirect above, uncomment this one
# and put the backend's address in it. The browser still sees one origin, so
# the admin session cookie keeps working.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL/api/:splat"
#   status = 200
#   force = true
