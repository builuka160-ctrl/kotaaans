# Only needed if you keep the frontend on Netlify and run backend/ somewhere
# else (Render, Railway, a VPS...). The site's js/app.js calls relative
# paths like fetch('/api/bookings') with no configurable base URL, so this
# proxy rule makes Netlify forward those calls to the real backend while the
# browser still sees everything as same-origin (so the admin session cookie
# keeps working). Replace YOUR-BACKEND-URL below with the deployed backend's
# address before publishing.
#
# If instead you deploy backend/ and the frontend together as one app (see
# backend/server.js, which already serves this frontend), you don't need
# this file at all — delete it.

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL/api/:splat"
  status = 200
  force = true
