name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: kotaaans
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /srv/kotaaans/deploy.sh
